# spec/logging.test.yaml
---
default_level: warn

# Output formatter
# Options: color, json, default
# - color: Human-readable with ANSI colors, timestamps, PID/thread (recommended)
# - json: Structured JSON for production log shipping
# - default: Plain text without colors
formatter: default

# Named logger levels
# Each category can be configured independently. Loggers added here are
# made available by the setup_loggers initializer.
loggers:
  App: warn # Default application logger
  Auth: info # Authentication/authorization flows
  Billing: info # Only used when billing.enabled=true
  Boot: warn # During initialization
  Bunny: warn # RabbitMQ client (heartbeats at debug level)
  CLI: info # Command-line interface operations
  Familia: warn # Redis/Familia main database operations
  HTTP: warn # HTTP requests and middleware operations
  Otto: warn # Otto framework operations
  Rhales: error # Rhales template rendering (suppress unescaped HTML warnings)
  Secret: info # Secret lifecycle (create, view, burn)
  Sequel: warn # Database queries and operations (SQL logged at :trace level)
  Session: info # Session lifecycle (create, update, destroy)

# Log destinations for a lane run (`tests/lanes/run --capture-logs` and
# `--log-console`). The runner exports these below its environment scrub;
# with neither set, nothing is written here and the shipped defaults apply
# (console on, file off).
#
#   LANES_APP_LOG_FILE=<absolute path>   enables the file destination. The
#                                        file is appended to; the runner
#                                        creates and truncates it.
#   LANES_APP_LOG_CONSOLE=off            disables the console destination
#   LANES_APP_LOG_CONSOLE=<level>        console threshold: trace, debug,
#                                        info, warn, error or fatal
#
# These choose where an event is written. The category levels above still
# decide which events exist: the file cannot hold an event its category
# rejected.
#
# A key is written only when it has a value, because a null here would
# replace the default beneath it. Values are quoted: a bare `off` is a YAML
# boolean. Any other value becomes the console level as given, so one that
# is not a level stops setup.
<%
  require 'json'
  lanes_app_log_file    = ENV['LANES_APP_LOG_FILE'].to_s.strip
  lanes_app_log_console = ENV['LANES_APP_LOG_CONSOLE'].to_s.strip
%>
<% unless lanes_app_log_file.empty? && lanes_app_log_console.empty? %>
destinations:
<%   unless lanes_app_log_console.empty? %>
  console:
<%     if lanes_app_log_console == 'off' %>
    enabled: false
<%     else %>
    level: <%= lanes_app_log_console.to_json %>
<%     end %>
<%   end %>
<%   unless lanes_app_log_file.empty? %>
  file:
    enabled: true
    path: <%= lanes_app_log_file.to_json %>
<%   end %>
<% end %>

# HTTP request logging configuration
http:
  # Set LOG_HTTP_REQUESTS=false to disable. Useful when running a reverse proxy
  # which already logs requests and you consolidate logs into one stream to
  # avoid redundant information.
  enabled: false
  # Overrides loggers.HTTP level for requests
  level: null

  # Capture mode determines what data is logged per request
  # Options: minimal, standard, debug
  #   minimal:  method, path, status, duration
  #   standard: + request_id, ip
  #   debug:    + params, headers, session_id
  capture: minimal

  # Threshold for logging slow requests as warnings (milliseconds)
  slow_request_ms: 500

  # Paths to ignore (glob patterns)
  ignore_paths:
    - /api/v1/status
    - /api/v2/status
    - /api/v3/status
    - /health
    - /healthcheck
    - /favicon.ico
    - /_vite/*
    - /assets/*
    - /dist/*
