# spec/auth.test.yaml
#
# Authentication Configuration for OneTimeSecret - TEST ENVIRONMENT
# Controls the authentication mode and related settings
---
# Authentication mode: 'simple' (Redis-only) or 'full' (requires SQL db)
# Defaults to 'simple' unless AUTHENTICATION_MODE env var is set
mode: <%= ENV.fetch('AUTHENTICATION_MODE', 'simple') %>

# Simple mode settings (Redis-only authentication)
simple:
  password_hash_cost: 12
  session_timeout: 86400 # 24 hours

# Full mode settings (Rodauth-based application)
full:
  # Database connection for Full mode
  # Uses in-memory SQLite for tests to avoid file persistence issues
  database_url: "<%= ENV['AUTH_DATABASE_URL'] || 'sqlite::memory:' %>"
  database_url_migrations: <%= ENV['AUTH_DATABASE_URL_MIGRATIONS'] || nil %>

  # Explicitly nil to prevent defaults layer from injecting ARGON2_SECRET
  # pepper into test hashes. Direct Argon2 verification in tests (e.g.
  # password_migration_spec) does not supply a pepper, so hashing must
  # also omit it.
  argon2_secret:

  # Optional Rodauth features (matches auth.defaults.yaml format)
  # For tests, lockout/password_requirements/sessions enabled by default; others disabled
  features:
    lockout: true
    password_requirements: true
    active_sessions: true
    remember_me: true
    verify_account: false  # Disabled in test mode
    # Env-aware like sso/oauth below: the dedicated MFA lane (rake
    # spec:integration:full:mfa) exports AUTH_MFA_ENABLED=true and needs the
    # REAL AuthConfig to report mfa enabled — the auth spec_helper's eager
    # application pre-load (#3234) runs Auth::Config's one-shot configure
    # before AuthModeHelpers::MockAuthConfig is installed, so a hardcoded
    # false here permanently strips the Rodauth OTP feature set from that
    # process. All other lanes leave the var unset and still get false.
    mfa: <%= ENV['AUTH_MFA_ENABLED'] == 'true' %>
    # Env-aware for the same reason as mfa above: the L-5 magic-link
    # rate-limit lane (apps/web/auth/spec/integration/full/
    # email_auth_rate_limit_spec.rb) exports AUTH_EMAIL_AUTH_ENABLED=true and
    # needs the REAL AuthConfig to report email_auth enabled so the
    # email-login-request route exists. All other lanes leave the var unset
    # and still get false.
    email_auth: <%= ENV['AUTH_EMAIL_AUTH_ENABLED'] == 'true' %>
    webauthn: false
    sso: <%= ENV['AUTH_SSO_ENABLED'] == 'true' %>
    oauth: <%= ENV['AUTH_OAUTH_ENABLED'] == 'true' %>

  # Restrict login page to a single auth method.
  # Values: password, email_auth, webauthn, sso (or blank for all)
  restrict_to:

  # SSO configuration section
  sso:
    sso_display_name: ''

  # Security settings
  security:
    password_minimum_length: 8
    max_invalid_logins: 5
    lockout_expiration: 3600 # 1 hour
    session_expire_after: 86400 # 24 hours
    require_email_confirmation: false # Set to true when email is configured
