# Shared by Ruby auth and browser auth coverage. Be conservative for shared
# code: new lib/etc modules must run auth without a dependency-graph update.
# Keep these simple positive globs; paths-filter matches dotfiles too.
auth:
  # Backend auth, tenant identity/SSO, and shared request/boot boundaries.
  - 'lib/**'
  - 'etc/**'
  - 'apps/web/auth/**'
  - 'apps/web/core/**'
  - 'apps/api/account/**'
  - 'apps/api/domains/**'
  - 'apps/api/organizations/**'
  - 'apps/api/invite/**'
  - 'apps/api/base_json_api.rb'
  - 'apps/api/v*/**'
  - 'apps/internal/**'
  - 'bin/**'
  - 'migrations/**'
  - 'tools/setup/**'
  - 'config.ru'
  - 'Rakefile'
  - 'Gemfile'
  - 'Gemfile.lock'
  - '*.gemspec'
  - '.ruby-version'
  - '.rspec'

  # Shared harness and full-auth integrations at the root AND in every app.
  # Do not use full*: full_billing is an independent suite.
  - 'tests/**'
  - '**/spec/integration/full/**'
  - '**/spec/integration/full_mfa/**'
  - '**/spec/integration/full_saml_platform/**'
  - 'spec/integration/all/**'
  - 'spec/integration/integration_spec_helper.rb'
  - '**/spec/support/**'
  - '**/spec/spec_helper.rb'
  - 'spec/*.yaml'
  - 'try/support/**'
  - 'try/security/**'
  - 'try/integration/auth/**'
  - 'try/integration/authentication/**'
  - 'try/integration/boot/**'
  - 'try/integration/middleware/**'
  - 'try/integration/*auth*'
  - 'try/system/**'

  # Session imports shared composables/stores/layouts, schemas, services, types,
  # and utils; main/App boot through plugins and router. Treat these shared
  # buckets conservatively, not as an exhaustive optimistic import graph.
  - 'src/apps/session/**'
  - 'src/shared/**'
  - 'src/router/**'
  - 'src/plugins/**'
  - 'src/api/**'
  - 'src/schemas/**'
  - 'src/services/**'
  - 'src/types/**'
  - 'src/utils/**'
  - 'src/sources/**'
  - 'src/assets/**'
  - 'src/build/**'
  - 'src/generated/**'
  - 'src/views/**'
  - 'src/main.ts'
  - 'src/i18n.ts'
  - 'src/App.vue'
  # Route registrations and tenant/account surfaces, not standalone billing
  # or dashboard views. Those views' shared dependencies are covered above.
  # These route tables are imported by the customer router. Admin uses its
  # own bundle/router and does not participate in these auth journeys.
  - 'src/apps/secret/routes/**'
  - 'src/apps/workspace/routes/**'
  - 'src/apps/workspace/account/**'
  - 'src/apps/workspace/domains/**'
  - 'src/apps/workspace/members/**'
  - 'src/apps/workspace/layouts/**'
  - 'src/apps/workspace/config/**'
  - 'src/apps/workspace/components/account/**'
  - 'src/apps/workspace/components/domains/**'
  - 'src/apps/workspace/components/members/**'
  - 'src/apps/workspace/components/organizations/**'
  - 'src/apps/workspace/components/layout/**'
  - 'src/apps/workspace/components/navigation/**'
  # These dashboard-named components are also imported by tenant domain pages
  # (DomainHeader, table cells, branding/delivery panels and their children).
  # OrganizationSettings also shares this billing-named entitlement prompt.
  - 'src/apps/workspace/components/dashboard/**'
  - 'src/apps/workspace/components/billing/EntitlementUpgradePrompt.vue'

  # Auth frontend tests and their harness; unrelated Vitest tests do not gate
  # the auth lanes just because they live under src/tests.
  - 'src/tests/apps/session/**'
  - 'src/tests/views/session/**'
  - 'src/tests/shared/**'
  - 'src/tests/router/**'
  - 'src/tests/plugins/**'
  - 'src/tests/support/**'
  - 'src/tests/fixtures/**'
  - 'src/tests/setup*'
  - 'src/tests/globalSetup.ts'
  - 'src/tests/composables/*Auth*'
  - 'src/tests/composables/*Reauth*'
  - 'src/tests/composables/*Sso*'
  - 'src/tests/composables/*Mfa*'
  - 'src/tests/composables/*MagicLink*'
  - 'src/tests/composables/*WebAuthn*'
  - 'src/tests/stores/auth*'
  - 'src/tests/stores/bootstrap*'
  - 'src/tests/stores/csrf*'
  - 'src/tests/stores/identity*'
  - 'src/tests/services/bootstrap*'
  - 'src/tests/services/impersonation*'
  - 'src/tests/services/signin*'
  - 'src/tests/services/sso*'

  # Browser auth/tenant suites and shared Playwright setup. Leave unrelated
  # e2e/full-billing, visual, and secret-only specs outside this selector.
  - 'e2e/auth/**'
  # Tenant Connect acceptance specs, seeding, and test boot live here.
  - 'e2e/system/**'
  - 'e2e/full/**'
  - 'e2e/all/auth-hydration*'
  - 'e2e/support/**'
  - 'e2e/global.setup.ts'
  - 'e2e/playwright*.ts'
  - 'playwright*.ts'

  # Build inputs, dependencies, versions, and CI machinery affect every lane.
  - 'Dockerfile*'
  - '.dockerignore'
  - 'docker/**'
  - 'compose*.yml'
  - 'docker-compose*.yml'
  - 'public/**'
  - 'templates/**'
  - 'locales/**'
  - 'generated/**'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '.npmrc'
  - '.node-version'
  - '.nvmrc'
  - '.bash-version'
  - 'tsconfig*.json'
  - 'vite.config*.ts'
  - 'vitest.config*.ts'
  - 'eslint.config.*'
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/scripts/**'
  - '.github/auth-paths.yml'
  - 'scripts/**'
