# .github/workflows/ruby-4-preview.yml
---
name: Ruby 4 Preview

# Standalone, non-blocking workflow that runs Ruby lint and tests under
# Ruby 4.0.2 so the team can see what breaks before committing to the
# upgrade. The Ruby-4-dependent steps are marked continue-on-error at
# the step level, so failures surface as yellow warning annotations
# (not red checks) and jobs still conclude green — visible signal
# without blocking merge or polluting the PR check list.
#
# Design notes:
# - Jobs are independent: each test job only needs build-assets for the
#   frontend artifact, and uses `if: always()` so a failure in one job
#   does not cascade into skipping others.
# - Test jobs run through tests/lanes/run — the same entry point as
#   ci.yml and local development — with services from compose.test.yml,
#   so the only intended variable is the Ruby version. They call it
#   through the run-test-lane composite, as ci.yml does, so the log
#   profile and the lane-logs artifact are the composite's and cannot
#   drift from CI's: the app's log is off the console and in the
#   artifact. This workflow is advisory, so it passes no results-file:
#   no RSpec JSON is written or uploaded, and nothing here is aggregated.
# - Artifacts are scoped per workflow run, so there is no collision with
#   the main CI workflow's `frontend-build` artifact.
# - `continue-on-error` is at the step level (not job level) on every
#   step whose outcome depends on Ruby 4 gem compatibility. Any failure
#   there — setup-ruby's bundle install, rubocop, or the lane run — is
#   captured as a warning annotation on the step while the job itself
#   completes successfully.
# - The Gemfile takes its Ruby from .ruby-version, so Bundler refuses to
#   load the bundle under any other Ruby. Every Ruby job therefore first
#   pins the checkout with .github/scripts/pin-ruby-version.sh (the
#   pin-ruby step: the one place the version under test is written),
#   which rewrites .ruby-version and the lockfile's RUBY VERSION entry
#   and leaves the locked gems as committed. That step is deliberately
#   NOT continue-on-error: when it fails, this workflow is broken, not
#   Ruby 4, and every later step would fail for the wrong reason.
# - Billing tests are nightly only, here as in ci.yml
#   (docs/development/auth-ci.md): the billing lanes and the billing-on
#   full-mode row are their own jobs, skipped on a pull request and run
#   on the schedule below (or a dispatch). The other jobs run on a pull
#   request and a dispatch, not on the schedule, so the nightly run is
#   the billing jobs and the frontend build they download.

on:
  # No base-branch filter, as in ci.yml: stacked PRs run too.
  pull_request:
  schedule:
    # Nightly, for the billing jobs only; after main CI's 04:03 run.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruby4-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    name: Ruby 4 · Build Frontend Assets
    runs-on: &runs-on ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - &checkout-step
        name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Build assets
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: public/web/dist/
          retention-days: 1
          if-no-files-found: error

  ruby-lint:
    name: Ruby 4 · Lint
    runs-on: *runs-on
    timeout-minutes: 5
    if: github.event_name != 'schedule'
    steps:
      - *checkout-step

      - &pin-ruby-step
        name: Pin the checkout to Ruby 4.0.2
        run: .github/scripts/pin-ruby-version.sh 4.0.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        continue-on-error: true
        with:
          ruby-version: '.ruby-version' # as pinned above
          bundler-cache: false # DEBUG: disabled to rule out stale cache

      - name: Install dependencies
        continue-on-error: true
        run: bundle install --jobs 4 --retry 3

      - name: Run Rubocop
        continue-on-error: true
        run: |
          mkdir -p tmp
          bundle exec rubocop --config .rubocop.yml \
            --format progress \
            --format json --out tmp/rubocop_results.json \
            --fail-level warning

      - name: Upload Rubocop results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruby4-rubocop-results
          path: tmp/rubocop_results.json
          retention-days: 7
          if-no-files-found: ignore

  ruby-unit:
    name: Ruby 4 · Unit Tests
    runs-on: *runs-on
    timeout-minutes: 15
    needs: [build-assets]
    if: always() && github.event_name != 'schedule'

    steps:
      - *checkout-step

      # Services come from compose.test.yml — the same containers ci.yml
      # and a local `tests/lanes/run` use.
      - &start-core-services
        name: Start test services (valkey, rabbitmq)
        run: docker compose -f compose.test.yml up --wait -d valkey rabbitmq

      - *pin-ruby-step

      - name: Setup Ruby test environment (may fail on bundle install)
        uses: ./.github/actions/setup-ruby-test-env
        continue-on-error: true

      # Locale + JSON-schema generation is owned by the lane's tasks file;
      # it needs python3, node, and pnpm on PATH.
      - name: Setup Python for locale sync
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Run unit lane (Ruby 4)
        continue-on-error: true
        uses: ./.github/actions/run-test-lane
        with:
          lane: unit

  # Nightly only (see the design notes): billing's own lanes.
  ruby-billing:
    name: Ruby 4 · Billing Tests
    runs-on: *runs-on
    timeout-minutes: 15
    needs: [build-assets]
    if: always() && github.event_name != 'pull_request'

    steps:
      - *checkout-step

      - *start-core-services

      - *pin-ruby-step

      - name: Setup Ruby test environment (may fail on bundle install)
        uses: ./.github/actions/setup-ruby-test-env
        continue-on-error: true

      - name: Setup Python for locale sync
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Run billing lane (Ruby 4)
        continue-on-error: true
        uses: ./.github/actions/run-test-lane
        with:
          lane: billing

      - name: Run billing-integration lane (Ruby 4)
        continue-on-error: true
        uses: ./.github/actions/run-test-lane
        with:
          lane: billing-integration

  ruby-integration-simple:
    name: Ruby 4 · Integration (Simple Mode)
    runs-on: *runs-on
    timeout-minutes: 15
    needs: [build-assets]
    if: always() && github.event_name != 'schedule'

    steps:
      - *checkout-step

      - *start-core-services

      - *pin-ruby-step

      - name: Setup Ruby test environment (may fail on bundle install)
        uses: ./.github/actions/setup-ruby-test-env
        continue-on-error: true

      - &setup-python-step
        name: Setup Python for locale sync
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - &setup-node-step
        name: Setup Node.js for locale sync
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'

      - &install-pnpm-step
        name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Run simple lane (Ruby 4)
        continue-on-error: true
        uses: ./.github/actions/run-test-lane
        with:
          lane: simple

  ruby-integration-full:
    name: 'Ruby 4 · Integration (Full, ${{ matrix.name }})'
    runs-on: *runs-on
    timeout-minutes: 15
    needs: [build-assets]
    if: always() && github.event_name != 'schedule'

    # Same lane + overlay pairing as ci.yml's SQLite matrix rows; the MFA
    # row is the only process that boots with AUTH_MFA_ENABLED. The
    # billing-on row is the nightly-only job below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'SQLite, billing: off'
            lane: full-sqlite
            overlay: ''
          - name: 'SQLite, MFA'
            lane: full-mfa
            overlay: ''
          - name: 'SQLite, platform SAML'
            lane: full-saml-platform
            overlay: ''

    steps: &full-integration-steps
      - *checkout-step

      - *start-core-services

      - *pin-ruby-step

      - name: Setup Ruby test environment (may fail on bundle install)
        uses: ./.github/actions/setup-ruby-test-env
        continue-on-error: true

      - *setup-python-step

      - *setup-node-step

      - *install-pnpm-step

      - name: Run lane (Ruby 4)
        continue-on-error: true
        uses: ./.github/actions/run-test-lane
        with:
          lane: ${{ matrix.lane }}
          overlay: ${{ matrix.overlay }}

  # Nightly only (see the design notes): the full-sqlite lane with the
  # billing overlay, as ci.yml's ruby-integration-billing SQLite row. A
  # one-row matrix so the shared steps' matrix references resolve.
  ruby-integration-full-billing:
    name: 'Ruby 4 · Integration (Full, ${{ matrix.name }})'
    runs-on: *runs-on
    timeout-minutes: 15
    needs: [build-assets]
    if: always() && github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'SQLite, billing: on'
            lane: full-sqlite
            overlay: 'billing'

    steps: *full-integration-steps

  ruby-integration-disabled:
    name: Ruby 4 · Integration (Disabled Mode)
    runs-on: *runs-on
    timeout-minutes: 15
    needs: [build-assets]
    if: always() && github.event_name != 'schedule'

    steps:
      - *checkout-step

      - *start-core-services

      - *pin-ruby-step

      - name: Setup Ruby test environment (may fail on bundle install)
        uses: ./.github/actions/setup-ruby-test-env
        continue-on-error: true

      - *setup-python-step

      - *setup-node-step

      - *install-pnpm-step

      - name: Run disabled lane (Ruby 4)
        continue-on-error: true
        uses: ./.github/actions/run-test-lane
        with:
          lane: disabled
