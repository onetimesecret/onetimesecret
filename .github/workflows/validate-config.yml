# .github/workflows/validate-config.yml
---
name: Validate YAML config
permissions:
  contents: read
  pull-requests: write

on:
  # push:
  #   branches:
  #     - 'main'
  #     - 'fix/*'
  #     - 'feature/*'
  #     - 'rel/*'

  # pull_request:
  #   branches:
  #     - main
  #     - develop
  #     - feature/*

  # Manual trigger option for debugging
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable tmate debugging for secure troubleshooting'
        required: false
        default: false

jobs:
  config-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # config version ratchet needs a merge-base

      - name: Assert Docker image tags match version pin files
        run: bash scripts/check-version-pins.sh

      - name: Assert .env.reference documents every consumed env var
        run: bash scripts/check-env-reference.sh

      - name: Assert config keys carry immutable "# Since" version markers
        run: bash scripts/check-config-versions.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version-file: '.ruby-version'
          bundler-cache: false  # DEBUG: disabled to rule out stale cache

      - name: Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Install Node dependencies
        run: pnpm install

      - name: Generate JSON schemas
        run: pnpm run schemas:json:generate

      - name: Validate config.defaults.yaml against the generated schema
        run: bin/ots config validate
