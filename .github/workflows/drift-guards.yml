# .github/workflows/drift-guards.yml
#
# Cheap (grep/sed-only, seconds) drift guards that must run on every PR
# (install-onboarding C9). They also run inside validate-config.yml, but that
# workflow is workflow_dispatch-only — these three checks are the ratchets that
# keep manifests honest, so they get an always-on lane:
#
#   check-version-pins.sh     Docker image tags + devcontainer toolchain match
#                             .ruby-version/.node-version (VER series, C8 note)
#   check-env-reference.sh    every consumed env var is documented in
#                             .env.reference or explicitly ignored (QS-11)
#   check-config-versions.sh  every new key in .env.reference and
#                             etc/defaults/*.yaml carries a "# Since" marker,
#                             and markers already on the PR's base branch are
#                             unchanged
#
# No path filter: check-env-reference.sh scans ENV reads across lib/, apps/,
# etc/ — nearly any code change can introduce a new variable, and the whole
# job costs seconds.
---
name: Drift guards

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-guards:
    name: version pins + env reference + config versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # check-config-versions.sh compares against the merge-base with the
          # PR's base branch. The default shallow checkout has neither the base
          # branch nor enough history to find a merge-base, and the guard would
          # quietly fall back to syntax-only checking.
          fetch-depth: 0

      - name: Assert Docker/devcontainer tags match version pin files
        run: bash scripts/check-version-pins.sh

      - name: Assert .env.reference documents every consumed env var
        run: bash scripts/check-env-reference.sh

      - name: Assert config keys carry immutable "# Since" version markers
        env:
          # Refuse to pass on a missing base ref rather than degrading to a
          # syntax-only check: a ratchet that silently stops ratcheting is
          # worse than one that fails loudly.
          CONFIG_VERSION_REQUIRE_BASE: '1'
        run: bash scripts/check-config-versions.sh
