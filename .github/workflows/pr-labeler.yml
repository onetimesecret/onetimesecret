# .github/workflows/pr-labeler.yml
---
# Onetime Secret Ops
#
# This workflow automatically labels PRs based on the files changed.
# Labels are mapped in .github/labeler.yml
#
# Documentation:
# https://github.com/actions/labeler
#
# ## Workflow Guidance
#
# - Use existing tags, don't create new tags, but suggestions always welcome.
# - Keep any Issue or PR templates minimal.
# - Use separate github workflows for triggers that are not copacetic: for
#   example, something that runs when an issue created shouldn't run when a
#   PR is created as well; or workflows that are meant to run on different
#   schedules.
#

name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          configuration-path: .github/labeler.yml
          # Whether or not to remove labels when matching files are reverted or no longer present in the PR
          sync-labels: false
