# .github/workflows/migration-tests.yml
---
name: Migration Tests

# Dedicated workflow for Rodauth database migration and trigger testing.
#
# Tests database schema migrations, triggers, and functions across both SQLite
# and PostgreSQL engines. These tests verify that:
# - Migrations run successfully without errors
# - Database triggers fire correctly
# - PostgreSQL-specific features (functions, citext, etc.) work as expected
# - Concurrent boots handle race conditions gracefully
#
# Architecture:
# - Three parallel jobs test different database scenarios
# - The SQLite and PostgreSQL jobs run through the migrations-* test lanes
#   (tests/lanes/) via the run-test-lane composite action — the same entry
#   point as local development. Services come from compose.test.yml.
# - The concurrent-boot job is deliberately NOT a lane: it orchestrates five
#   parallel boot processes against a scratch database, which is CI-side
#   process choreography rather than a test suite (tests/lanes/README.md
#   rule 4). It still uses compose.test.yml for services.
#
# Test Files:
# - spec/integration/full/database_triggers/sqlite_spec.rb
# - spec/integration/full/database_triggers/postgres_spec.rb
# - spec/integration/full/postgres_infrastructure_spec.rb
#
# Performance Targets:
# - SQLite tests: < 2 minutes
# - PostgreSQL tests: < 5 minutes
# - Concurrent boot: < 3 minutes

on:
  pull_request:
    branches:
      - main
      - develop
      - 'rel/*'
    paths:
      - 'apps/web/auth/migrations/**'
      - 'apps/web/auth/database.rb'
      - 'apps/web/auth/rodauth.rb'
      - 'spec/integration/full/database_triggers/**'
      - 'spec/integration/full/*_infrastructure_spec.rb'
      - 'spec/support/*_database.rb'
      - 'tests/lanes/**'
      - 'compose.test.yml'
      - '.github/workflows/migration-tests.yml'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable tmate debugging session'
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # SQLite Migration Tests (~90s)
  # ==========================================================================
  migration-tests-sqlite:
    name: SQLite Migrations & Triggers
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # valkey + rabbitmq, not valkey alone: base.env carries RABBITMQ_URL
      # for every lane and the lane runner's preflight requires every
      # endpoint in the lane's env to be reachable.
      - name: Start test services (valkey, rabbitmq)
        run: docker compose -f compose.test.yml up --wait -d valkey rabbitmq

      - name: Setup Ruby environment
        uses: ./.github/actions/setup-ruby-test-env
        with:
          download-artifacts: 'false'

      # Locale compilation prereq is owned by the lane's tasks file; it only
      # needs python3 on PATH (stdlib-only script, no Node).
      - name: Setup Python (locale compilation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run migrations-sqlite lane
        uses: ./.github/actions/run-test-lane
        with:
          lane: migrations-sqlite
          results-file: 'sqlite_migration_results.json'
          debug-enabled: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Upload SQLite test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlite-migration-results
          path: tmp/sqlite_migration_results.json
          retention-days: 7
          if-no-files-found: warn

  # ==========================================================================
  # PostgreSQL Migration Tests (~4min)
  # ==========================================================================
  migration-tests-postgres:
    name: PostgreSQL Migrations & Triggers
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # PG roles (onetime_user/onetime_migrator) come from compose.test.yml's
      # initdb mount on first boot — no separate psql setup step.
      - name: Start test services (valkey, rabbitmq, postgres)
        run: docker compose -f compose.test.yml up --wait -d valkey rabbitmq postgres

      - name: Setup Ruby environment
        uses: ./.github/actions/setup-ruby-test-env
        with:
          download-artifacts: 'false'

      - name: Setup Python (locale compilation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # The lane runs the trigger/infrastructure specs and the dual-URL
      # migration check (spec:integration:migrations:verify_dual_url).
      - name: Run migrations-pg lane
        uses: ./.github/actions/run-test-lane
        with:
          lane: migrations-pg
          results-file: 'postgres_migration_results.json'
          debug-enabled: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-migration-results
          path: tmp/postgres_migration_results.json
          retention-days: 7
          if-no-files-found: warn

  # ==========================================================================
  # Concurrent Boot Simulation (~2min)
  # ==========================================================================
  # Not a lane on purpose: this job choreographs five parallel boot
  # processes against a scratch database — gating/orchestration policy that
  # belongs to CI (tests/lanes/README.md rule 4). Services and ports still
  # come from compose.test.yml so the pins live in one place.
  migration-tests-concurrent:
    name: Concurrent Boot & Race Conditions
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Start test services (valkey, postgres)
        run: docker compose -f compose.test.yml up --wait -d valkey postgres

      - name: Setup Ruby environment
        uses: ./.github/actions/setup-ruby-test-env
        with:
          download-artifacts: 'false'

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        if: inputs.debug_enabled == true
        with:
          detached: true

      # A scratch database so concurrent-boot churn never touches
      # onetime_auth_test (which the migrations-pg lane owns).
      - name: Create concurrent-boot database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 2154 -U postgres -c 'CREATE DATABASE onetime_auth_test_concurrent'

      - name: Simulate concurrent boot scenario
        env:
          RACK_ENV: test
          AUTHENTICATION_MODE: full
          AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:2154/onetime_auth_test_concurrent
          REDIS_URL: redis://127.0.0.1:2163/0
        run: |
          set -e
          echo "## Concurrent Boot Simulation" >> $GITHUB_STEP_SUMMARY
          echo "Simulating multiple instances starting simultaneously..." >> $GITHUB_STEP_SUMMARY

          # Simulate 5 instances booting concurrently
          # Each should handle migrations gracefully without errors
          PIDS=()
          for i in {1..5}; do
            (
              bundle exec ruby -e '
                require "bundler/setup"
                require_relative "lib/onetime"
                require_relative "apps/web/auth/database"

                puts "Starting boot"
                Auth::Database.ensure_migrations!
                puts "Boot complete"
              ' 2>&1 | sed "s/^/[Instance $i] /"
            ) &
            PIDS+=($!)
          done

          # Wait for all instances and check for failures
          FAILED=0
          for pid in "${PIDS[@]}"; do
            if ! wait $pid; then
              FAILED=1
              echo "- Instance with PID $pid FAILED" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ $FAILED -eq 0 ]; then
            echo "- All 5 instances booted successfully" >> $GITHUB_STEP_SUMMARY
            echo "- No race conditions detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "- FAILED: Some instances encountered errors" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Verify migration idempotency
        env:
          RACK_ENV: test
          AUTHENTICATION_MODE: full
          AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:2154/onetime_auth_test_concurrent
          REDIS_URL: redis://127.0.0.1:2163/0
        run: |
          echo "### Migration Idempotency Test" >> $GITHUB_STEP_SUMMARY

          # Run migrations 3 times - should be idempotent
          for i in {1..3}; do
            bundle exec ruby -e '
              require "bundler/setup"
              require_relative "lib/onetime"
              require_relative "apps/web/auth/database"
              Auth::Database.ensure_migrations!
            '
          done

          echo "- Migrations are idempotent (ran 3 times without errors)" >> $GITHUB_STEP_SUMMARY

      - name: Check for schema consistency
        env:
          PGPASSWORD: postgres
        run: |
          echo "### Schema Consistency Check" >> $GITHUB_STEP_SUMMARY

          # Verify critical tables exist
          TABLES=$(psql -h 127.0.0.1 -p 2154 -U postgres -d onetime_auth_test_concurrent -t -c "
            SELECT string_agg(tablename, ', ')
            FROM pg_tables
            WHERE schemaname = 'public'
            ORDER BY tablename;
          " | xargs)

          echo "- Tables: $TABLES" >> $GITHUB_STEP_SUMMARY

          # Verify critical triggers exist
          TRIGGERS=$(psql -h 127.0.0.1 -p 2154 -U postgres -d onetime_auth_test_concurrent -t -c "
            SELECT string_agg(trigger_name, ', ')
            FROM information_schema.triggers
            WHERE trigger_schema = 'public'
            ORDER BY trigger_name;
          " | xargs)

          echo "- Triggers: $TRIGGERS" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Test Aggregation
  # ==========================================================================
  aggregate-migration-results:
    name: Aggregate Migration Test Results
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs:
      - migration-tests-sqlite
      - migration-tests-postgres
      - migration-tests-concurrent
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download all test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-migration-results'
          path: migration-results/
          merge-multiple: true
        continue-on-error: true

      - name: Generate summary
        id: summary
        run: |
          SQLITE_RESULT="${{ needs.migration-tests-sqlite.result }}"
          PG_RESULT="${{ needs.migration-tests-postgres.result }}"
          CONCURRENT_RESULT="${{ needs.migration-tests-concurrent.result }}"

          SUMMARY="## Migration Test Results\n\n"
          SUMMARY+="| Job | Status |\n"
          SUMMARY+="|-----|--------|\n"

          status_icon() {
            case "$1" in
              success)   echo "pass" ;;
              failure)   echo "FAIL" ;;
              cancelled) echo "skip" ;;
              skipped)   echo "skip" ;;
              *)         echo "??" ;;
            esac
          }

          SUMMARY+="| SQLite Migrations | $(status_icon "$SQLITE_RESULT") |\n"
          SUMMARY+="| PostgreSQL Migrations | $(status_icon "$PG_RESULT") |\n"
          SUMMARY+="| Concurrent Boot | $(status_icon "$CONCURRENT_RESULT") |\n"

          if [ -d "migration-results" ]; then
            SUMMARY+="\n### Detailed Results\n\n"
            for file in migration-results/*.json; do
              if [ -f "$file" ]; then
                NAME=$(basename "$file" .json)
                TOTAL=$(jq -r '.summary.example_count // "N/A"' "$file")
                FAILURES=$(jq -r '.summary.failure_count // "N/A"' "$file")
                SUMMARY+="- **$NAME**: $TOTAL tests, $FAILURES failures\n"
              fi
            done
          fi

          echo -e "$SUMMARY" >> $GITHUB_STEP_SUMMARY

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          echo -e "$SUMMARY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const body = process.env.SUMMARY_BODY;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const marker = '## Migration Test Results';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
        env:
          SUMMARY_BODY: ${{ steps.summary.outputs.body }}
