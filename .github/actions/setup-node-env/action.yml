# .github/actions/setup-node-env/action.yml
---
# ==============================================================================
# Setup Node.js Environment - Composite Action
# ==============================================================================
# Version: 1.1.0
# Repository: onetimesecret/onetimesecret
#
# Prepares a Node.js environment with pnpm and caching for CI jobs.
# Consolidates common frontend setup steps.
#
# Toolchain pins live in the repo, not here: Node comes from .node-version
# (actions/setup-node's node-version-file) and pnpm from package.json's
# "packageManager" field (pnpm/action-setup with no version literal). The
# node-version input is an explicit override only; when empty (the default)
# actions/setup-node falls back to node-version-file.
#
# Setup Steps:
#   1. Install Node.js (from .node-version unless node-version overrides it)
#   2. Install pnpm package manager (version from package.json packageManager)
#   3. Configure pnpm store caching
#   4. Install dependencies with frozen lockfile (optional)
#
# Usage:
#   - uses: ./.github/actions/setup-node-env
#     with:
#       install-dependencies: 'true'
#
#   # Explicit override (e.g. a preview lane testing a newer major):
#   - uses: ./.github/actions/setup-node-env
#     with:
#       node-version: '27'
#
# Changelog:
#   1.1.0 - Read Node major from .node-version; node-version is override-only
#   1.0.0 - Initial release consolidating Node setup from ci.yml
# ==============================================================================

name: Setup Node.js Environment
description: |
  Sets up Node.js with pnpm and caching for CI jobs.
  Handles Node.js installation, pnpm setup, cache configuration,
  and dependency installation.

inputs:
  node-version:
    description: 'Explicit Node.js version override. Empty (default) reads .node-version.'
    required: false
    default: ''
  install-dependencies:
    description: 'Whether to run pnpm install'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # actions/setup-node uses node-version when set and otherwise reads
    # node-version-file, so an empty override input yields the repo pin.
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: '.node-version'

    # No version input: pnpm/action-setup reads package.json "packageManager".
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    # DEBUG: pnpm cache disabled to rule out stale cache
    # - name: Setup pnpm cache
    #   uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
    #   with:
    #     path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
    #     key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
    #     restore-keys: |
    #       ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
