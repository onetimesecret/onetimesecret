# Call after checkout; the caller needs contents: read and pull-requests: read.
# Callers own event triggers (including main/tag push and PR labeled/unlabeled).
name: Detect auth changes
description: Select shared auth coverage from cumulative PR paths, current labels, or forcing.

inputs:
  force:
    description: 'Run auth regardless of paths; only the strings true and false are accepted.'
    required: false
    default: 'false'

outputs:
  auth:
    description: 'Boolean string indicating whether auth coverage must run.'
    value: ${{ steps.compute.outputs.auth }}
  reason:
    description: 'Selection reason: event:<event>, force, label:ci:auth, paths, or no-auth-changes.'
    value: ${{ steps.compute.outputs.reason }}

runs:
  using: composite
  steps:
    # The pulls API returns the cumulative PR diff, not just the latest commit.
    # Never invoke git detection for events whose coverage is unconditional.
    - name: Filter cumulative PR paths
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: .github/auth-paths.yml

    - name: Compute auth selection
      id: compute
      shell: bash
      env:
        # A skipped filter has no output. Supply false only off the PR path;
        # missing/malformed PR outputs must reach the script and fail closed.
        FILTER_AUTH: ${{ github.event_name != 'pull_request' && 'false' || steps.filter.outputs.auth }}
        FORCE_AUTH: ${{ inputs.force }}
        EVENT_NAME: ${{ github.event_name }}
        # Use the full current PR label set, not the triggering label. Other
        # events have no labels: pass an explicit array, not an absent projection.
        LABELS_JSON: ${{ github.event_name != 'pull_request' && '[]' || toJSON(github.event.pull_request.labels.*.name) }}
      run: bash .github/scripts/compute-auth-selection.sh
