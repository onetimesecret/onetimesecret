# .github/actions/run-test-lane/action.yml
---
# ==============================================================================
# Run Test Lane - Composite Action
# ==============================================================================
# Version: 1.1.0
# Repository: onetimesecret/onetimesecret
#
# Runs one test lane (tests/lanes/<lane>) and layers CI-only result artifacts,
# log artifacts and job summaries on top. The lane owns environment and task
# list (what runs in which environment); this action owns reporting.
# That split is rule 4 in tests/lanes/README.md.
#
# Every lane runs with the log capture profile: the application's log goes to
# a file that is uploaded as the lane-logs-<lane>-<overlay or base> artifact,
# not to the console.
#
# The workflow owns service lifecycle (docker compose -f compose.test.yml),
# so the lane runner's autostart is disabled here (LANES_NO_AUTOSTART).
#
# Usage:
#   - uses: ./.github/actions/run-test-lane
#     with:
#       lane: full-pg
#       overlay: billing
#       results-file: 'rspec_full_postgres_billing_on_results.json'
#
# Changelog:
#   1.1.0 - Log capture profile and the lane-logs artifact (#4683)
#   1.0.0 - Initial release; replaces run-ruby-tests for lane-based jobs
# ==============================================================================

name: Run Test Lane
description: |
  Runs a test lane via tests/lanes/run with CI result artifacts, a log
  artifact and a job summary.

inputs:
  lane:
    description: 'Lane name (a directory under tests/lanes/)'
    required: true
  overlay:
    description: 'Optional overlay name (tests/lanes/overlays/<name>.env)'
    required: false
    default: ''
  results-file:
    description: >-
      Name for the RSpec JSON results file (written to tmp/). Empty skips
      RSPEC_OUTPUT_FILE plumbing (e.g. the smoke lane).
    required: false
    default: ''
  debug-enabled:
    description: 'Enable tmate debugging session'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      if: inputs.debug-enabled == 'true'
      with:
        detached: true

    # Where this lane and overlay keep their run files, asked of the runner
    # itself: --print-key derives the answer and exits without starting or
    # writing anything, so the path cannot differ from the one the run below
    # uses. It is a step of its own, ahead of the lane, so the upload further
    # down has the path however the lane ends.
    #
    # The artifact is lane-logs-<lane>-<overlay or base>. A job runs one lane
    # and overlay pair, so the name is unique within a workflow run, and it
    # cannot match the 'rspec-*-results' pattern the aggregate job downloads
    # (tools/testsuite/run-test-lane-action-test.sh checks both for every
    # caller). A re-run attempt uploads under the same name beside the
    # earlier attempt's artifact, as the RSpec results already do. That is
    # this repository's run history, not a documented guarantee: CI run
    # 37408734822 (three attempts) lists rspec-unit-results twice and
    # unified-test-report three times. Were it to change, this step would
    # fail on a re-run with a name conflict.
    - name: Locate lane logs
      id: lane-logs
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        OVERLAY: ${{ inputs.overlay }}
      run: |
        args=(tests/lanes/run "$LANE" --capture-logs --print-key)
        if [ -n "$OVERLAY" ]; then
          args+=(--overlay "$OVERLAY")
        fi
        app_log="$("${args[@]}" | sed -n 's/^app_log=//p')"
        case "$app_log" in
          /*/app.log) ;;
          *)
            echo "::error::tests/lanes/run --print-key reported no app_log path (got '${app_log}')"
            exit 1
            ;;
        esac
        dir="${app_log%/app.log}"
        name="lane-logs-${LANE}-${OVERLAY:-base}"
        # Artifact names may not contain " \ / : < > | * ? or CR/LF.
        name="${name//[^A-Za-z0-9._-]/-}"
        {
          echo "dir=${dir}"
          echo "name=${name}"
        } >> "$GITHUB_OUTPUT"
        echo "Lane logs: ${dir}/app.log and last.log, uploaded as artifact ${name}"

    - name: Run lane
      id: run-lane
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        OVERLAY: ${{ inputs.overlay }}
        RESULTS_FILE: ${{ inputs.results-file }}
        # CI owns service lifecycle; never let the runner start compose.
        LANES_NO_AUTOSTART: '1'
      run: |
        mkdir -p tmp
        if [ -n "$RESULTS_FILE" ]; then
          export RSPEC_OUTPUT_FILE="tmp/${RESULTS_FILE}"
        fi
        # The log capture profile (tests/lanes/README.md, "Captured logs"):
        #   --capture-logs     the app's log goes to app.log in the lane's
        #                      run directory, and delivered emails to mail.log
        #                      beside it.
        #   --log-console off  the app's log is not printed. No log level is
        #                      raised, so app.log holds the expected
        #                      error-level events too.
        #   --quiet            rspec prints failures, pending examples, the
        #                      summary and the seed, nothing per passing
        #                      example. The results file is still written.
        # A full-mode lane's default output is ~9 MB, nearly all of it log
        # lines and email bodies. To go back to it, remove the three flags
        # here; the upload below then finds only last.log.
        args=(tests/lanes/run "$LANE" --capture-logs --log-console off --quiet)
        if [ -n "$OVERLAY" ]; then
          args+=(--overlay "$OVERLAY")
        fi
        # The lane's wall-clock seconds, for the job summary. Recorded
        # whatever the lane's exit status, which stays this step's.
        started=$SECONDS
        status=0
        "${args[@]}" || status=$?
        echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
        exit "$status"

    # The lane writes RSpec's JSON to tmp/ but nothing collected it, so the
    # T5 aggregate job had nothing to aggregate (its unified report read
    # total_examples: 0). Name the artifact rspec-<stem>-results so the
    # aggregate job can download the RSpec JSONs alone — 'rspec-*-results'
    # excludes rubocop-results, whose rubocop_results.json also satisfies the
    # aggregation script's *_results.json find pattern.
    - name: Name the RSpec results artifact
      id: results-artifact
      if: always() && inputs.results-file != ''
      shell: bash
      env:
        RESULTS_FILE: ${{ inputs.results-file }}
      run: |
        stem="${RESULTS_FILE%.json}"
        # Glob, not the bare filename: a lane whose rake task writes one JSON
        # per rspec invocation suffixes this stem rather than overwriting it.
        echo "glob=tmp/${stem}*.json" >> "$GITHUB_OUTPUT"
        # rspec_full_pg_billing_on_results -> full_pg_billing_on; artifact
        # names may not contain " \ / : < > | * ? or CR/LF.
        stem="${stem#rspec_}"
        stem="${stem%_results}"
        echo "name=rspec-${stem//[^A-Za-z0-9._-]/-}-results" >> "$GITHUB_OUTPUT"

    - name: Upload RSpec results
      if: always() && steps.results-artifact.outputs.name != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.results-artifact.outputs.name }}
        path: ${{ steps.results-artifact.outputs.glob }}
        # Aggregation happens in the same run; nobody reads these later.
        retention-days: 3
        # A lane that dies before RSpec runs has no JSON to upload, and that
        # is already reported as the lane step's failure.
        if-no-files-found: ignore

    # The run's logs, kept apart from the results above: a different name
    # prefix, and no file the aggregation script's rspec_*.json or
    # *_results.json patterns could pick up.
    #   app.log   the application's log events (scrubbed like any app log)
    #   last.log  the console transcript of the run
    # mail.log stays on the runner: it is raw email content that no log
    # scrubbing has seen. always(): a lane that fails, or that dies before
    # RSpec writes any JSON, is the run whose logs are wanted. A run that
    # stopped before the runner created its files has nothing to upload.
    - name: Upload lane logs
      id: lane-logs-upload
      if: always() && steps.lane-logs.outputs.name != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.lane-logs.outputs.name }}
        path: |
          ${{ steps.lane-logs.outputs.dir }}/app.log
          ${{ steps.lane-logs.outputs.dir }}/last.log
        # For reading one failure, not for keeping.
        retention-days: 3
        if-no-files-found: ignore

    - name: Generate job summary
      if: always()
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        OVERLAY: ${{ inputs.overlay }}
        RESULTS_FILE: ${{ inputs.results-file }}
        LOG_ARTIFACT: ${{ steps.lane-logs.outputs.name }}
        LOG_ARTIFACT_URL: ${{ steps.lane-logs-upload.outputs.artifact-url }}
        LOG_DIR: ${{ steps.lane-logs.outputs.dir }}
        LANE_SECONDS: ${{ steps.run-lane.outputs.seconds }}
      run: |
        echo "## Lane Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| lane | \`${LANE}\` |" >> $GITHUB_STEP_SUMMARY
        if [ -n "${OVERLAY}" ]; then
          echo "| overlay | \`${OVERLAY}\` |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -n "${RESULTS_FILE}" ]; then
          results_base="${RESULTS_FILE%.json}"
          results_files=("tmp/${RESULTS_FILE}" "tmp/${results_base}"_*.json)
          existing_results=()
          empty_results=()

          # An rspec process that dies before it finishes leaves its results
          # file empty, or cut off part-way and not JSON. Its examples are in
          # no total; say so by name. One such file given to the jq below
          # would blank the totals of the files that can be read.
          for results_file in "${results_files[@]}"; do
            if [ -s "$results_file" ] && jq -e 'type == "object"' "$results_file" > /dev/null 2>&1; then
              existing_results+=("$results_file")
            elif [ -f "$results_file" ]; then
              empty_results+=("$results_file")
            fi
          done

          if [ "${#existing_results[@]}" -gt 0 ] || [ "${#empty_results[@]}" -gt 0 ]; then
            echo "### RSpec" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${#existing_results[@]}" -gt 0 ]; then
            echo "- Total: $(jq -s '[.[].summary.example_count] | add' "${existing_results[@]}")" >> $GITHUB_STEP_SUMMARY
            echo "- Failures: $(jq -s '[.[].summary.failure_count] | add' "${existing_results[@]}")" >> $GITHUB_STEP_SUMMARY
          fi
          for results_file in ${empty_results[@]+"${empty_results[@]}"}; do
            echo "- No results in \`${results_file}\`: its rspec process did not finish" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -n "${LOG_ARTIFACT}" ]; then
          {
            echo "### Logs"
            if [ -n "${LOG_ARTIFACT_URL}" ]; then
              echo "- Artifact: [\`${LOG_ARTIFACT}\`](${LOG_ARTIFACT_URL}), kept 3 days: \`app.log\` (application log) and \`last.log\` (console transcript)"
            else
              echo "- Artifact: \`${LOG_ARTIFACT}\` was not uploaded (the run left no log files, or the upload failed)"
            fi
            echo "- On the runner: \`${LOG_DIR}\`"
            # What this run wrote and how long it took, measured: last.log
            # is the console transcript, so its size is the console output.
            # The numbers to compare a change to the log profile against.
            for entry in "last.log:console output" "app.log:application log" "mail.log:delivered emails, not uploaded"; do
              log_file="${LOG_DIR}/${entry%%:*}"
              if [ -f "$log_file" ]; then
                echo "- \`${entry%%:*}\` (${entry#*:}): $(wc -c < "$log_file" | tr -d '[:space:]') bytes"
              fi
            done
            if [ -n "${LANE_SECONDS}" ]; then
              echo "- Lane run: ${LANE_SECONDS}s"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi
