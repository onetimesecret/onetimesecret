[project]
name = "envref"
version = "0.1.0"
description = "Release-version annotations for the onetimesecret config reference"
requires-python = ">=3.11"
dependencies = ["cyclopts>=4.25.2"]

# The suite runs on the stdlib (`python -m unittest discover -s tests`), the
# same arrangement as locales/scripts. pytest is a convenience, not a
# requirement, so CI needs nothing beyond the runtime dependency above.
[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
envref = "envref.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envref"]
