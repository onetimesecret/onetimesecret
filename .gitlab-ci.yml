workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "rel/0.26" || $CI_COMMIT_TAG'

ruby-runtime:
  stage: test
  image: docker:29.9.3-cli@sha256:5a7af0dcb0e46c803efe9b45371dd21cb500e5b4453250394ac6f06d49b6e6f1
  tags: [saas-linux-medium-amd64]
  timeout: 25m
  services:
    - name: docker:29.9.3-dind@sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b
      alias: docker
      command: ["--registry-mirror=https://mirror.gcr.io"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    FF_NETWORK_PER_BUILD: "true"
  script:
    - apk add --no-cache bash
    - bash scripts/check-version-pins.sh
    - docker buildx create --driver docker-container --use
    - >
      docker buildx bake -f docker/bake.hcl main --load
      --set main.tags=onetimesecret-hotfix:ci
      --set main.args.ALLOW_DEV_VERSION=true
    - >
      docker run --rm --entrypoint ruby onetimesecret-hotfix:ci
      -e 'abort "Unexpected runtime Ruby #{RUBY_VERSION}" unless RUBY_VERSION == File.read(".ruby-version").strip'
    - docker run --rm --entrypoint bundle onetimesecret-hotfix:ci check
