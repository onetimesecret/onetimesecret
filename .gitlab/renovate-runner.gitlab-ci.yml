# Renovate, run from a pipeline schedule (docs/planning/2026-1110-gitlab-ci-migration-plan.md
# §4.9, D11).
#
# This file is the CI/CD configuration of the private project
# onetimesecret/renovate-runner. Its CI/CD configuration file setting is
#   .gitlab/renovate-runner.gitlab-ci.yml@onetimesecret/onetimesecret:develop
# This project's own pipeline does not include this file.
#
# The runner project holds the pipeline schedule and two masked CI/CD
# variables:
#   RENOVATE_TOKEN             personal access token of the Renovate group
#                              service account (scopes api, read_user,
#                              write_repository). The account has the
#                              Developer role on onetimesecret/onetimesecret.
#   RENOVATE_GITHUB_COM_TOKEN  GitHub token with read access to public
#                              repositories, for GitHub Actions digests,
#                              github-tags lookups and changelogs.
#
# Renovate reads a repository's config file from the default branch, main.
# Its merge requests target develop, and main receives develop only through
# promotions. So Renovate ignores the repository's config file
# (requireConfig: ignored), and this job passes .gitlab/renovate.json5 from
# develop as Renovate's global config.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

renovate:
  image: ghcr.io/renovatebot/renovate:44.198.3@sha256:bf344aa39d5b592ec728e1db5c3e1d940a5093a89a4598073efcb18d592d121c
  tags: [saas-linux-small-amd64]
  timeout: 1h
  # One run at a time: a run that overlaps the next schedule waits.
  resource_group: renovate
  variables:
    TARGET_PROJECT: onetimesecret/onetimesecret
    TARGET_PROJECT_ID: "88874403"
    CONFIG_REF: develop
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REQUIRE_CONFIG: ignored
    RENOVATE_ONBOARDING: "false"
    RENOVATE_CONFIG_FILE: $CI_PROJECT_DIR/renovate.json5
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/renovate
    RENOVATE_REPOSITORY_CACHE: enabled
    LOG_FILE: renovate-log.ndjson
    LOG_FILE_LEVEL: debug
  cache:
    key: renovate
    paths:
      - renovate/cache/renovate/repository/
  script:
    - |
      if [ -z "${RENOVATE_TOKEN:-}" ]; then
        echo "RENOVATE_TOKEN is not set in the runner project's CI/CD variables" >&2
        exit 1
      fi
    - >-
      curl --fail --silent --show-error
      --header "PRIVATE-TOKEN: ${RENOVATE_TOKEN}"
      --output "$RENOVATE_CONFIG_FILE"
      "${CI_API_V4_URL}/projects/${TARGET_PROJECT_ID}/repository/files/.gitlab%2Frenovate.json5/raw?ref=${CONFIG_REF}"
    - renovate "$TARGET_PROJECT"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - renovate-log.ndjson
