# .gitlab/ci/lint.yml
#
# The jobs of .github/workflows/static-analysis.yml, on GitLab. They need no
# services and run on small hosted runners. The GitHub workflow keeps running
# on mirrored pushes to main until GitLab's runs have matched it (plan Phase 2,
# docs/planning/2026-1110-gitlab-ci-migration-plan.md).
#
# Images are referenced by digest literals: GitLab advises against image
# references built from variables. Debian trixie is required for jq 1.7, which
# the shell suites use (bookworm ships jq 1.6).

.lint-python:
  stage: lint
  image: python:3.14.7-trixie@sha256:0876e54cf728d89fd9d0fdaf5837b9ee879ea5fbbd6fd0cddbe5eb0cce3f5f9e
  tags: [saas-linux-small-amd64]
  needs: []
  timeout: 10m

# bin/testsuite run: the offline shell suites under tools/testsuite/, which pin
# the GitHub workflow wiring and execute the scripts CI calls.
shell-tests:
  extends: .lint-python
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends jq
  script:
    - bash bin/testsuite run

compose-quick-start:
  extends: .lint-python
  variables:
    COMPOSE_VERSION: 'v5.7.0'
    COMPOSE_SHA256: '7758048ad38e580f22559603312874fec8bb638d021a9e64182385fc17cc12a2'
  rules:
    - changes:
        - README.md
        - .env.example
        - docker/README.md
        - docker-compose.yml
        - docker/compose/**/*
        - .gitlab/ci/lint.yml
        - bin/testsuite-installer
        - tools/testsuite-installer/check-compose-quick-start.sh
        - tools/testsuite-installer/testsuite-installer.sh
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends acl ca-certificates curl docker-cli openssl
    - |
      plugin=/usr/local/lib/docker/cli-plugins/docker-compose
      install -d "$(dirname "$plugin")"
      curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" -o "$plugin"
      printf '%s  %s\n' "$COMPOSE_SHA256" "$plugin" | sha256sum -c -
      chmod 0755 "$plugin"
  script:
    - bin/testsuite-installer check-compose-quick-start

# shellcheck over every tracked shell script and actionlint over the GitHub
# workflows, against the recorded baselines in .github/lint-baseline/.
shell-lint:
  extends: .lint-python
  script:
    - scripts/install-shell-lint-tools.sh /usr/local/bin
    - bash scripts/check-shell-lint.sh

# The log shipper's tests on the oldest and newest supported Python. uv
# provides 3.11; the image provides 3.14.
logship:
  extends: .lint-python
  parallel:
    matrix:
      - UV_PYTHON: ['3.11', '3.14']
  variables:
    # Same as the uv install in static-analysis.yml (gitlab-lint-pins-test.sh).
    UV_VERSION: '0.9.7'
  before_script:
    - python -m pip install --disable-pip-version-check --root-user-action=ignore "uv==${UV_VERSION}"
  script:
    - bin/logship --help
    - bin/testsuite logship -q

bundler-audit:
  stage: lint
  image: ruby:3.4.13-trixie@sha256:2cfc090f052933db5abcde345187115dde23f3a44f9620a0e7482cb33ecd9834
  tags: [saas-linux-small-amd64]
  needs: []
  timeout: 10m
  variables:
    # Same as static-analysis.yml; tools/testsuite/gitlab-lint-pins-test.sh
    # fails when the two differ.
    BUNDLER_AUDIT_VERSION: '0.9.3'
  before_script:
    - gem install bundler-audit -v "${BUNDLER_AUDIT_VERSION}" --no-document
  script:
    - bundle-audit check --update
